<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0e14">
  <title>Page not found — Cheng-You Cheng</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0b0e14; color: #edf0f5; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(620px, 100%); padding: clamp(28px, 7vw, 56px); border: 1px solid #283544; border-radius: 12px; background: #111923; }
    p { color: #aab5c3; line-height: 1.7; }
    .eyebrow { color: #8bb8ff; font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 12px 0; font: normal clamp(40px, 8vw, 64px)/1 Georgia, "Times New Roman", serif; letter-spacing: -.04em; }
    a { display: inline-block; margin-top: 14px; color: #8bb8ff; font-weight: 700; text-underline-offset: 4px; }
    a:focus-visible { outline: 3px solid #f08a62; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">404 · Page not found</div>
    <h1>This page took a different path.</h1>
    <p>The link may be outdated, or the page may no longer be here.</p>
    <a href="/">Return to my personal website ↗</a>
  </main>
</body>
</html>
